[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-ai"
version = "0.1.0"
description = "AI-assisted AWS infrastructure analysis tool"
requires-python = ">=3.12"

[project.scripts]
infra-ai = "infra_ai.cli.main:main"

[tool.setuptools.packages.find]
include = ["infra_ai*"]
